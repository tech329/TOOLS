    <script>
        // Loading screen functions
        const loaderStartTime = Date.now();
        const MIN_LOADER_TIME = 1200;
        
        function hideLoadingScreen() {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                const elapsed = Date.now() - loaderStartTime;
                const remainingTime = Math.max(0, MIN_LOADER_TIME - elapsed);
                
                setTimeout(() => {
                    loadingScreen.classList.add('fade-out');
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 300);
                }, remainingTime);
            }
        }

        // Verificar sesión y ocultar loader
        (function() {
            const sessionData = localStorage.getItem('appSession');
            if (!sessionData) {
                window.location.href = '../login.html';
                return;
            }
            try {
                const session = JSON.parse(sessionData);
                const nameEl = document.getElementById('user-name');
                const avatarEl = document.getElementById('user-avatar');
                const emailEl = document.getElementById('user-email');
                const userName = session.name || session.nombre || 'Usuario';
                const userEmail = session.email || session.correo || '';
                if (nameEl) nameEl.textContent = userName;
                if (avatarEl) avatarEl.textContent = userName.charAt(0).toUpperCase();
                if (emailEl) emailEl.textContent = userEmail || 'Sin correo';
            } catch (e) {
                console.error('Error parsing session:', e);
            }
            hideLoadingScreen();
        })();

        // Set current date in Guayaquil time
        function getGuayaquilDate() {
            const now = new Date();
            const guayaquilTime = new Date(now.toLocaleString("en-US", {timeZone: "America/Guayaquil"}));
            const day = guayaquilTime.getDate();
            const monthNames = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
            const month = monthNames[guayaquilTime.getMonth()];
            const year = guayaquilTime.getFullYear();
            const hours = guayaquilTime.getHours();
            const minutes = guayaquilTime.getMinutes();
            let displayHours = hours;
            let period = 'de la mañana';
            if (hours >= 12) {
                period = hours >= 18 ? 'de la noche' : 'de la tarde';
                if (hours > 12) displayHours = hours - 12;
            }
            if (hours === 0) displayHours = 12;
            const timeStr = `a las ${displayHours} ${period} ${minutes} minutos`;
            return { day, month, year, full: `Machachi a los ${day} días del mes de ${month} del año ${year}, ${timeStr}.` };
        }

        // Initialize date
        const fecha = getGuayaquilDate();
        document.getElementById('fechaDisplay').textContent = fecha.full;

        // Check for URL Parameters
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const paramCedula = urlParams.get('cedula');
            const paramNombre = urlParams.get('nombre');

            if (paramCedula) {
                const cedulaInput = document.getElementById('cedula');
                cedulaInput.value = paramCedula;
                if (paramNombre) {
                    const nombreInput = document.getElementById('nombre');
                    nombreInput.value = decodeURIComponent(paramNombre).toUpperCase();
                    nombreInput.disabled = false;
                    nombreInput.classList.remove('bg-gray-100');
                } else {
                    fetchCedulaData(paramCedula);
                }
            }
        });

        // Webhook URL para buscar nombres
        const WEBHOOK_CEDULA = 'https://lpn8nwebhook.luispintasolutions.com/webhook/c460611e-8d0c-4a7b-bfcc-50b1e5858048';

        // Input validations
        document.getElementById('cedula').addEventListener('input', function(e) {
            this.value = this.value.replace(/\D/g, '');
        });

        // Trigger lookup on blur
        document.getElementById('cedula').addEventListener('blur', function(e) {
            const cedula = this.value.trim();
            if (cedula.length === 10 && /^\d{10}$/.test(cedula)) {
                fetchCedulaData(cedula);
            }
        });

        // Trigger lookup on Enter key
        document.getElementById('cedula').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const cedula = this.value.trim();
                if (cedula.length === 10 && /^\d{10}$/.test(cedula)) {
                    fetchCedulaData(cedula);
                }
            }
        });

        document.getElementById('nombre').addEventListener('input', function() {
            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.toUpperCase();
            this.setSelectionRange(start, end);
        });

        async function fetchCedulaData(cedula) {
            const nombreInput = document.getElementById('nombre');
            
            nombreInput.value = 'BUSCANDO...';
            nombreInput.disabled = true;
            nombreInput.classList.add('bg-gray-100');
            
            try {
                const data = window.APP_CONFIG?.fetchCedulaLookup
                    ? await window.APP_CONFIG.fetchCedulaLookup(cedula)
                    : await fetchCedulaLookupFallback(cedula);
                
                const result = Array.isArray(data) ? data[0] : null;

                if (result && result.encontrado && result.nombre) {
                    nombreInput.value = result.nombre.toUpperCase();
                    nombreInput.disabled = false; 
                    nombreInput.classList.remove('bg-gray-100');
                    showToast('Nombre encontrado exitosamente', 'success');
                } else {
                    nombreInput.value = '';
                    nombreInput.disabled = false;
                    nombreInput.classList.remove('bg-gray-100');
                    nombreInput.placeholder = 'Ingrese el nombre manualmente';
                    nombreInput.focus();
                    showToast(result?.mensaje || 'Revise la cédula. Si no existe, ingrese manualmente.', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                nombreInput.value = '';
                nombreInput.disabled = false;
                nombreInput.classList.remove('bg-gray-100');
                nombreInput.placeholder = "Ingrese el nombre manualmente";
                nombreInput.focus();
                showToast('El servidor no responde. Ingrese manualmente.', 'error');
            }
        }

        async function fetchCedulaLookupFallback(cedula) {
            const requests = [
                {
                    url: WEBHOOK_CEDULA,
                    init: {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ cedula })
                    }
                }
            ];
            let lastError = null;

            for (const request of requests) {
                try {
                    const response = await fetch(request.url, request.init);
                    if (!response.ok) throw new Error('Network response was not ok');
                    return await response.json();
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError || new Error('No se pudo consultar la cédula');
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.className = 'fixed top-5 right-5 px-6 py-4 rounded-lg shadow-lg transform transition-all duration-300 z-50';
            
            if (type === 'success') {
                toast.classList.add('bg-green-600', 'text-white');
            } else if (type === 'error') {
                toast.classList.add('bg-red-600', 'text-white');
            } else {
                toast.classList.add('bg-gray-800', 'text-white');
            }
            
            toast.classList.remove('translate-x-[200%]');
            
            setTimeout(() => {
                toast.classList.add('translate-x-[200%]');
            }, 3000);
        }

        function showModal(message, onConfirm) {
            document.getElementById('modalMessage').innerHTML = message;
            document.getElementById('confirmModal').classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            document.getElementById('confirmYes').onclick = function() {
                document.getElementById('confirmModal').classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
                onConfirm();
            };
            document.getElementById('confirmNo').onclick = function() {
                document.getElementById('confirmModal').classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
            };
        }

        function showAlert(message) {
            document.getElementById('modalMessage').innerHTML = message;
            document.getElementById('confirmModal').classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            document.getElementById('confirmYes').style.display = 'none';
            document.getElementById('confirmNo').textContent = 'OK';
            document.getElementById('confirmNo').onclick = function() {
                document.getElementById('confirmModal').classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
                document.getElementById('confirmYes').style.display = 'block';
                document.getElementById('confirmNo').textContent = 'No';
            };
        }

        function generarDocumento() {
            const nombre = document.getElementById('nombre').value.trim();
            const cedula = document.getElementById('cedula').value.trim();

            if (!nombre || !cedula) {
                showAlert('Por favor, complete todos los campos.');
                return;
            }

            const nombreWords = nombre.split(/\s+/).filter(word => word.length > 0);
            if (nombreWords.length < 3) {
                showAlert('El nombre debe contener al menos 3 palabras (nombres y apellidos).');
                return;
            }

            if (!/^\d{10}$/.test(cedula)) {
                showAlert('La cédula debe contener exactamente 10 dígitos numéricos sin espacios ni guiones.');
                return;
            }

            const confirmMessage = `¿Estás seguro de que deseas generar la autorización con <strong>${nombre}</strong> y cédula <strong>${cedula}</strong>? Fecha: ${fecha.full}`;
            showModal(confirmMessage, function() {
                const template = generateTemplate(nombre, cedula, nombre, fecha.full);
                const newWindow = window.open('', '_blank');
                newWindow.document.write(template);
                newWindow.document.close();
            });
        }

        function descargarDocumento() {
            showToast('Generando PDF...', 'info');
            
            const fechaManual = `Lugar y fecha: Machachi, _______ de ${fecha.month} del año ${fecha.year}`;
            const htmlContent = generateTemplate('________________________________________', '____________________________', '____________________________', fechaManual);
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;
            tempDiv.style.position = 'absolute';
            tempDiv.style.left = '-9999px';
            document.body.appendChild(tempDiv);
            
            const element = tempDiv.querySelector('.sheet');
            
            const opt = {
                margin: 0,
                filename: 'autorizacion_buro_credito.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: 'avoid-all' }
            };
            
            html2pdf().set(opt).from(element).save().then(() => {
                document.body.removeChild(tempDiv);
                showToast('PDF descargado exitosamente', 'success');
            }).catch((error) => {
                console.error('Error generating PDF:', error);
                document.body.removeChild(tempDiv);
                showToast('Error al generar el PDF', 'error');
            });
        }
        
        // ===== VERIFICACIÓN DE SESIÓN =====
        let sessionCheckInterval = null;
        const SESSION_CHECK_INTERVAL = 60000;
        
        function setupUserInfo(userData) {
            const nameEl = document.getElementById('user-name');
            const emailEl = document.getElementById('user-email');
            const avatarEl = document.getElementById('user-avatar');
            const roleEl = document.getElementById('user-role');
            
            if (nameEl && userData.name) {
                nameEl.textContent = userData.name;
            }
            if (emailEl && userData.email) {
                emailEl.textContent = userData.email;
            }
            if (avatarEl && userData.name) {
                avatarEl.textContent = userData.name.charAt(0).toUpperCase();
            }
            if (roleEl && userData.rol) {
                const roles = userData.rol.split(',').map(r => r.trim().toUpperCase());
                const filtered = roles.filter(r => r === 'ASESOR' || r === 'ADMIN').join(', ');
                roleEl.textContent = filtered;
            }
        }
        
        let protectedPage = null;
        
        async function handleSessionExpired() {
            await showAlert('Tu sesión ha expirado. Por favor, inicia sesión nuevamente.');
            if (typeof TupakAuth !== 'undefined') {
                TupakAuth.logout();
                return;
            }
            window.location.href = '../login.html';
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof TupakAuth === 'undefined' || typeof TupakAuth.initializeProtectedPage !== 'function') {
                window.location.href = '../login.html';
                return;
            }

            protectedPage = TupakAuth.initializeProtectedPage({
                redirectOnFailure: false,
                onSession: setupUserInfo,
                onInvalid: handleSessionExpired
            });

            await protectedPage.start();
        });
    </script>
    <script src="../../shared/auth.js"></script>
</body>
</html>
