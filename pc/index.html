<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#001749">
    <title>Centro de Herramientas - Tupak Rantina</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" href="../shared/img/logo.webp" type="image/png">
    
    <!-- Estilos compartidos -->
    <link rel="stylesheet" href="css/main.css">
    
    <style>
        :root {
            --primary: #001749;
            --secondary: #e48410;
            --accent: #3787c6;
            --blue: #015cd0;
        }
        
        * { font-family: 'Inter', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ed 100%);
            min-height: 100vh;
        }
        
        .card-module {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .card-module:hover:not(.disabled) {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        
        .card-module.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .card-module.disabled:hover {
            transform: none;
        }
        
        .badge-soon {
            background: linear-gradient(135deg, var(--secondary), #f59e0b);
            font-size: 0.65em;
            padding: 4px 10px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
        }
        
        .sidebar {
            background: var(--primary);
            width: 280px;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
        }
        
        .main-content {
            margin-left: 280px;
            padding: 30px 40px;
            min-height: 100vh;
        }
        
        .logo-container {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .logo-img {
            max-width: 100px;
            margin-bottom: 12px;
        }
        
        .user-info {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--secondary), #f59e0b);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.2em;
        }
        
        .nav-item {
            padding: 14px 20px;
            color: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .nav-item.logout {
            color: #ef4444;
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .nav-item.logout:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        
        .module-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            color: white;
        }
        
        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
        }
        
        .toast {
            background: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <!-- Loader de sesión -->
    <div id="session-loader" class="fixed inset-0 bg-gradient-to-br from-[#001749] to-[#015cd0] flex items-center justify-center z-50">
        <div class="text-center text-white">
            <div class="w-16 h-16 border-4 border-white/30 border-t-[#e48410] rounded-full animate-spin mx-auto mb-6"></div>
            <p class="text-lg font-semibold" id="loader-text">Verificando sesión...</p>
        </div>
        <div class="absolute bottom-10 flex flex-col items-center gap-2 opacity-70">
            <span class="text-white text-xs font-semibold tracking-wider">POWERED BY</span>
            <img src="../shared/img/lpsolutionswithe.webp" alt="LP Solutions" class="h-5 brightness-0 invert">
        </div>
    </div>
    
    <!-- Sidebar -->
    <aside class="sidebar flex flex-col">
        <div class="logo-container">
            <img src="../shared/img/logo.webp" alt="Logo" class="logo-img mx-auto">
            <h2 class="text-white font-bold text-lg">Centro de Herramientas</h2>
            <p class="text-white/60 text-sm">Tupak Rantina</p>
        </div>
        
        <div class="user-info flex items-center gap-3">
            <div class="user-avatar" id="user-avatar">U</div>
                <div class="flex-1">
                    <p class="text-white font-semibold text-sm" id="user-name">Usuario</p>
                    <div class="mt-1">
                        <span id="user-role" class="inline-block px-2 py-0.5 bg-white/10 border border-white/20 rounded-full text-[9px] font-bold text-white/80 uppercase tracking-wider"></span>
                    </div>
                </div>
        </div>
        
        <nav class="flex-1 py-4" id="sidebar-nav">
            <div class="nav-item active">
                <i class="fas fa-home w-5"></i>
                <span>Inicio</span>
            </div>
            <div id="dynamic-shortcuts"></div>
        </nav>
        
        <div class="nav-item logout" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt w-5"></i>
            <span>Cerrar Sesión</span>
        </div>
        
        <div class="p-4 border-t border-white/10 text-center">
            <p class="text-white/40 text-xs mb-1">POWERED BY</p>
            <img src="../shared/img/lpsolutionswithe.webp" alt="LP Solutions" class="h-5 mx-auto opacity-60" style="filter: brightness(0) invert(1);">
        </div>
    </aside>
    
    <!-- Contenido Principal -->
    <main class="main-content">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-[#001749]">Bienvenido, <span id="welcome-name">Usuario</span></h1>
            <p class="text-gray-500 mt-1">Selecciona una herramienta para comenzar</p>
        </div>
        
        <!-- Grid de Módulos -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="modules-grid">
            <!-- Los módulos se cargan dinámicamente -->
        </div>
        
        <!-- Info Footer -->
        <div class="mt-12 p-6 bg-white/50 rounded-2xl border border-gray-200">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-gradient-to-br from-[#001749] to-[#015cd0] rounded-xl flex items-center justify-center">
                    <i class="fas fa-info-circle text-white text-xl"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-[#001749]">¿Necesitas ayuda?</h3>
                    <p class="text-gray-500 text-sm">Contacta al área de sistemas para soporte técnico</p>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>
    
    <!-- Scripts compartidos -->
    <script src="../shared/config.js"></script>
    <script src="../shared/auth.js"></script>
    <script src="../shared/pwa.js"></script>
    
    <script>
        // ===== CONSTANTES DE PERSISTENCIA =====
        const USAGE_KEY = 'module_usage_history';

        // ===== INICIALIZACIÓN =====
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🏠 Cargando Dashboard PC...');
            
            // Verificar autenticación
            if (typeof TupakAuth === 'undefined' || !TupakAuth.checkAuth()) {
                console.log('❌ Sin sesión válida, redirigiendo a login...');
                window.location.href = 'login.html';
                return;
            }
            
            // Verificar token con servidor
            const isValid = await TupakAuth.checkTokenValidity();
            if (!isValid) {
                window.location.href = 'login.html';
                return;
            }
            
            // Cargar datos de usuario
            loadUserData();
            
            // Cargar módulos
            loadModules();

            // Renderizar accesos directos dinámicos en sidebar
            renderSidebarShortcuts();
            
            // Ocultar loader
            setTimeout(() => {
                document.getElementById('session-loader').style.display = 'none';
            }, 800);
        });
        
        // ===== CARGAR DATOS USUARIO =====
        function loadUserData() {
            const session = TupakAuth.getSession();
            if (session) {
                const name = session.name || 'Usuario';
                const initial = name.charAt(0).toUpperCase();
                
                document.getElementById('user-avatar').textContent = initial;
                document.getElementById('user-name').textContent = name;
                const roleEl = document.getElementById('user-role');
                if (roleEl && session.rol) {
                    const roles = session.rol.split(',').map(r => r.trim().toUpperCase());
                    const filtered = roles.filter(r => r === 'ASESOR' || r === 'ADMIN').join(', ');
                    roleEl.textContent = filtered;
                }
                document.getElementById('welcome-name').textContent = name.split(' ')[0];
            }
        }
        
        // ===== CARGAR MÓDULOS =====
        function loadModules() {
            const grid = document.getElementById('modules-grid');
            const modules = APP_CONFIG.MODULES;
            
            grid.innerHTML = '';
            
            for (const key in modules) {
                const mod = modules[key];
                const isEnabled = mod.enabled;
                
                const card = document.createElement('div');
                card.className = `card-module bg-white rounded-2xl p-6 shadow-lg ${!isEnabled ? 'disabled' : ''}`;
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="module-icon bg-gradient-to-br ${mod.color}">
                            <i class="fas ${mod.icon}"></i>
                        </div>
                        ${!isEnabled ? '<span class="badge-soon">Próximamente</span>' : ''}
                    </div>
                    <h3 class="font-bold text-lg text-[#001749] mb-2">${mod.name}</h3>
                    <p class="text-gray-500 text-sm">${mod.description}</p>
                `;
                
                if (isEnabled) {
                    card.onclick = () => navigateToModule(mod, key);
                } else {
                    card.onclick = () => showToast('info', 'Este módulo estará disponible próximamente');
                }
                
                grid.appendChild(card);
            }
        }

        // ===== LÓGICA DE PERSISTENCIA Y SHORTCUTS =====
        function trackModuleUsage(moduleKey) {
            let history = JSON.parse(localStorage.getItem(USAGE_KEY) || '[]');
            // Agregar al inicio
            history.unshift(moduleKey);
            // Limitar a los últimos 25 accesos
            if (history.length > 25) history = history.slice(0, 25);
            localStorage.setItem(USAGE_KEY, JSON.stringify(history));
        }

        function renderSidebarShortcuts() {
            const container = document.getElementById('dynamic-shortcuts');
            const history = JSON.parse(localStorage.getItem(USAGE_KEY) || '[]');
            const modules = APP_CONFIG.MODULES;
            
            if (history.length === 0) return;

            // Contar frecuencia
            const counts = {};
            history.forEach(key => {
                if (modules[key]) counts[key] = (counts[key] || 0) + 1;
            });

            // Obtener los 3 más usados
            const topMostUsed = Object.entries(counts)
                .sort((a, b) => b[1] - a[1]) // Orden descendente por frecuencia
                .slice(0, 3)
                .map(entry => entry[0]);

            container.innerHTML = '';
            
            topMostUsed.forEach(key => {
                const mod = modules[key];
                const shortcut = document.createElement('div');
                shortcut.className = 'nav-item';
                shortcut.innerHTML = `
                    <i class="fas ${mod.icon} w-5"></i>
                    <span>${mod.name}</span>
                `;
                shortcut.onclick = () => navigateToModule(mod, key);
                container.appendChild(shortcut);
            });
        }
        
        // ===== NAVEGACIÓN =====
        function navigateToModule(module, key) {
            if (key) trackModuleUsage(key);
            window.location.href = module.pcPath;
        }
        
        // ===== LOGOUT =====
        function handleLogout() {
            if (confirm('¿Estás seguro que deseas cerrar sesión?')) {
                TupakAuth.logout();
            }
        }
        
        // ===== TOAST =====
        function showToast(type, message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const icons = {
                success: '<i class="fas fa-check-circle text-green-500 text-xl"></i>',
                error: '<i class="fas fa-times-circle text-red-500 text-xl"></i>',
                info: '<i class="fas fa-info-circle text-blue-500 text-xl"></i>'
            };
            
            toast.innerHTML = `
                ${icons[type] || icons.info}
                <span class="text-gray-700">${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
